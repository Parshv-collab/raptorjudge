# RaptorJudge — nginx config for the static frontend.
#
# Listens on 3000, serves the Vite build output, and proxies the REST API
# (/api/*) to the backend's Convex HTTP-actions port. The SPA itself calls
# /api/* relatively, so no backend origin is hardcoded in the frontend code.
#
# Security headers (security items 65 + 67 + 70)
# ----------------------------------------------
# The SPA is the only thing a visitor's browser executes, so this file is where
# the browser-side policy lives:
#
#   * `X-Content-Type-Options: nosniff` — no MIME sniffing, so an uploaded or
#     proxied body cannot be re-interpreted as HTML/JS.
#   * `Referrer-Policy: no-referrer` — certificate/UUID-bearing URLs do not
#     leak to third parties through Referer.
#   * `Content-Security-Policy` — no event-handler or injected inline script
#     can run (`script-src 'self'`); `object-src`/`base-uri`/`form-action`
#     locked down so a stored payload has nowhere to go.
#   * `frame-ancestors` — the app itself may only be framed by its own origin;
#     the one route that is *designed* to be embedded (`/embed/…`) opts into
#     `*` explicitly.
#   * `server_tokens off` + no `X-Powered-By` — no version disclosure.
#
# `connect-src` has to allow the SPA's Convex deployment, which an operator
# points anywhere via VITE_CONVEX_URL (a separate port on the same host by
# default), so it permits http/https/ws/wss rather than a single hardcoded
# origin. Tighten it to your own backend origin if you deploy behind a proxy.
#
# NOTE: nginx does not merge `add_header` across levels — a location that
# defines any `add_header` of its own replaces the inherited set, so each
# location below repeats the full block deliberately.

server {
    listen       3000;
    listen  [::]:3000;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Docker's internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Shared policy value; locations only vary `frame-ancestors`.
    set $csp_default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'";
    set $csp_embed "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors *";

    # Long-lived, immutable, content-hashed static assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp_default always;
        try_files $uri =404;
    }

    # Embeddable gallery widget — the one route built to live inside someone
    # else's iframe, so framing is allowed for it and only it.
    location /embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp_embed always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # REST API + Convex Auth HTTP routes live on the backend's HTTP-actions
    # port (3211). Frontend code calls these relatively, e.g. /api/health.
    # The backend applies its own CORS policy; we only add the content-sniffing
    # and referrer headers here (no CSP: these responses are JSON/CSV, not
    # documents).
    location /api/ {
        set $backend_api http://backend:3211;
        proxy_pass         $backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Convex client sync (WebSocket) for deployments that route the client
    # through this origin instead of talking to the backend directly.
    location /ws_api {
        set $backend_ws http://backend:3210;
        proxy_pass         $backend_ws; 
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — every React Router route resolves to index.html.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $csp_default always;
        # index.html names hashed bundles, so it must never be cached stale
        # (a stale shell pointing at deleted assets is a blank page).
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
