# RaptorJudge — nginx config for the static frontend.
#
# Listens on 3000, serves the Vite build output, and proxies the REST API
# (/api/*) to the backend's Convex HTTP-actions port. The SPA itself calls
# /api/* relatively, so no backend origin is hardcoded in the frontend code.

server {
    listen       3000;
    listen  [::]:3000;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every React Router route resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API + Convex Auth HTTP routes live on the backend's HTTP-actions
    # port (3211). Frontend code calls these relatively, e.g. /api/health.
    location /api/ {
        proxy_pass         http://backend:3211;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Convex client sync (WebSocket) for deployments that route the client
    # through this origin instead of talking to the backend directly.
    location /ws_api {
        proxy_pass         http://backend:3210;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Vite emits content-hashed asset filenames, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
